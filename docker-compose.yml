version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: saspulse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: saspulse
      POSTGRES_USER: saspulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-saspulse123}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saspulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saspulse_network

  redis:
    image: redis:7-alpine
    container_name: saspulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - saspulse_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: saspulse_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://saspulse:${DB_PASSWORD:-saspulse123}@db:5432/saspulse
      - REDIS_URL=redis://redis:6379/0
      - CIN7_API_URL=${CIN7_API_URL:-https://api.cin7.com/api/v1}
      - CIN7_USERNAME=${CIN7_USERNAME}
      - CIN7_API_KEY=${CIN7_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saspulse_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: saspulse_celery
    command: celery -A saspulse worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://saspulse:${DB_PASSWORD:-saspulse123}@db:5432/saspulse
      - REDIS_URL=redis://redis:6379/0
      - CIN7_API_URL=${CIN7_API_URL:-https://api.cin7.com/api/v1}
      - CIN7_USERNAME=${CIN7_USERNAME}
      - CIN7_API_KEY=${CIN7_API_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    networks:
      - saspulse_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: saspulse_celery_beat
    command: celery -A saspulse beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DATABASE_URL=postgresql://saspulse:${DB_PASSWORD:-saspulse123}@db:5432/saspulse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend
    networks:
      - saspulse_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  saspulse_network:
    driver: bridge
