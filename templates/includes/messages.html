{% if messages %}
  <div class="messages-container" role="region" aria-live="polite" aria-label="Notifications">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" data-message-type="{{ message.tags }}">
        <div class="d-flex align-items-start">
          {% if message.tags == 'success' %}
            <span data-feather="check-circle" class="alert-icon me-2"></span>
          {% elif message.tags == 'error' or message.tags == 'danger' %}
            <span data-feather="alert-circle" class="alert-icon me-2"></span>
          {% elif message.tags == 'warning' %}
            <span data-feather="alert-triangle" class="alert-icon me-2"></span>
          {% else %}
            <span data-feather="info" class="alert-icon me-2"></span>
          {% endif %}
          <div class="alert-message flex-grow-1">{{ message }}</div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
